[package]
name = "mhfz-core"
version = "0.1.0"
edition = "2021"
description = "Loadout evaluator and armor-set search engine for MHFZ Set Searcher, compiled to WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[dev-dependencies]
# Golden-set tests run natively (no WASM) against the evaluator, per Phase 3 of the plan.

[profile.release]
opt-level = 3
lto = true
